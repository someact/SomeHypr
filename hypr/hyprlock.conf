# Fallback lock screen (used when the shell has no lock of its own, or crashed).
# Colors and wallpaper path come from matugen.
source = ~/.config/hypr/generated/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = $background_image
    color = rgba(181818FF)
    blur_passes = 3
    blur_size = 6
    brightness = 0.75
}

input-field {
    monitor =
    size = 260, 50
    rounding = -1
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    font_family = $font_family
    capslock_color = rgba(e5a50aFF)
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL</i>
    fade_on_empty = true
    position = 0, 20
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 65
    font_family = $font_family_clock
    position = 0, 300
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text_color
    font_size = 17
    font_family = $font_family_clock
    position = 0, 240
    halign = center
    valign = center
}

label { # User
    monitor =
    text = $USER
    color = $text_color
    font_size = 20
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Keyboard layout
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}
