# Generated by matugen from ~/.config/matugen/templates/terminal/kitty-theme.conf
# ANSI colors are a fixed palette blended toward the wallpaper (config.toml custom_colors).

background            {{colors.surface.default.hex}}
foreground            {{colors.on_surface.default.hex}}
cursor                {{colors.on_surface.default.hex}}
cursor_text_color     {{colors.surface.default.hex}}
selection_background  {{colors.secondary_container.default.hex}}
selection_foreground  {{colors.on_secondary_container.default.hex}}
url_color             {{colors.primary.default.hex}}

active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.outline_variant.default.hex}}
active_tab_background   {{colors.primary_container.default.hex}}
active_tab_foreground   {{colors.on_primary_container.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}

color0   {{colors.surface_container_high.default.hex}}
color1   {{colors.term_red.default.hex}}
color2   {{colors.term_green.default.hex}}
color3   {{colors.term_yellow.default.hex}}
color4   {{colors.term_blue.default.hex}}
color5   {{colors.term_magenta.default.hex}}
color6   {{colors.term_cyan.default.hex}}
color7   {{colors.on_surface_variant.default.hex}}
color8   {{colors.outline.default.hex}}
color9   {{colors.term_red.default.hex | lighten: 8}}
color10  {{colors.term_green.default.hex | lighten: 8}}
color11  {{colors.term_yellow.default.hex | lighten: 8}}
color12  {{colors.term_blue.default.hex | lighten: 8}}
color13  {{colors.term_magenta.default.hex | lighten: 8}}
color14  {{colors.term_cyan.default.hex | lighten: 8}}
color15  {{colors.on_surface.default.hex}}

# Material roles at the end of the 256-color table, for prompts (starship) that use them
color255 {{colors.primary.default.hex}}
color254 {{colors.primary_container.default.hex}}
color253 {{colors.secondary.default.hex}}
color252 {{colors.secondary_container.default.hex}}
color251 {{colors.tertiary.default.hex}}
color250 {{colors.tertiary_container.default.hex}}
color249 {{colors.error.default.hex}}
color248 {{colors.error_container.default.hex}}
